services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env.production
    restart: unless-stopped
    stop_grace_period: 30s
    ports: ["127.0.0.1:3001:3001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: &container-logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["node", "dist/worker.js"]
    env_file: .env.production
    restart: unless-stopped
    stop_grace_period: 2m
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    logging: *container-logging

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args: { NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}" }
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *container-logging

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      args: { NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}" }
    restart: unless-stopped
    ports: ["127.0.0.1:3002:3002"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *container-logging

  postgres:
    image: postgres:16-alpine
    env_file: .env.production
    restart: unless-stopped
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *container-logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    restart: unless-stopped
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *container-logging

volumes:
  postgres_data:
  redis_data:
