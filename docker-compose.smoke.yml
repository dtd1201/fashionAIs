name: fashionais-smoke

x-api-environment: &api-environment
  env_file:
    - ${SMOKE_ENV_FILE:-.env.smoke}

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - ${SMOKE_ENV_FILE:-.env.smoke}
    restart: unless-stopped
    volumes:
      - smoke_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    restart: unless-stopped
    volumes:
      - smoke_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    env_file:
      - ${SMOKE_ENV_FILE:-.env.smoke}

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    <<: *api-environment
    command: ["sh", "-c", "/app/node_modules/.bin/prisma migrate deploy --schema prisma/schema.prisma && node dist/main.js"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    healthcheck:
      disable: true
    build:
      context: .
      dockerfile: api/Dockerfile
    <<: *api-environment
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    stop_grace_period: 2m
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://localhost:8445/api/v1
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://localhost:8445/api/v1
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8444:8444"
      - "127.0.0.1:8445:8445"
    volumes:
      - ./Caddyfile.smoke:/etc/caddy/Caddyfile:ro
      - smoke_caddy_data:/data
      - smoke_caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
      admin:
        condition: service_started

volumes:
  smoke_postgres_data:
  smoke_redis_data:
  smoke_caddy_data:
  smoke_caddy_config:
